name: Check and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libclang-dev cmake pkg-config
      - name: Install stable Rust
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - name: Check application
        run: ./scripts/check.sh
      - name: Build release archive
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/*
