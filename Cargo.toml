[package]
name = "bilibili-live-helper"
version = "3.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
blake2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
md-5 = "0.11"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rusqlite = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.11"
sha3 = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
wreq = { version = "0.16.1", features = ["json", "form", "query", "gzip", "brotli"] }
wreq-util = "0.2"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
